name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-service-key
      API_KEYS: test-key
      MISTRAL_API_KEY: ""
      INWORLD_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v1
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest
