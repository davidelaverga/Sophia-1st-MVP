      - "always"
      - "never"
      - "constantly"
      - "all the time"
      - "again and again"
    weight: 0.7
    
  future_oriented:
    patterns:
      - "I'm worried about"
      - "what if"
      - "I'm afraid that"
      - "I hope"
      - "I'm planning to"
    weight: 0.6

# ----------------------------------------------------------------------------
# 12. SOPHIA-SPECIFIC INTERACTION MARKERS
# ----------------------------------------------------------------------------

sophia_relationship_markers:
  category: "ai_companionship_dynamics"
  description: "Patterns specific to human-AI relationship development"
  
  testing_boundaries:
    patterns:
