celebration_contraindication_markers:
  category: "not_breakthrough"
  description: "Patterns that should NOT trigger CELEBRATING_BREAKTHROUGH"
  
  i_got:
    patterns:
      - "I got"
      - "I got the"
      - "I received"
      - "I obtained"
