      - "are you proud of me"
      - "you must be proud"
      - "proud of me"
    weight: 0.6
    contraindication: "celebrating_breakthrough"  # Seeking validation, not breakthrough
  
  did_i_do_right:
    patterns:
      - "did I do right"
      - "did I do the right thing"
      - "was that right"
      - "was I right"
    weight: 0.6
    contraindication: "celebrating_breakthrough"  # Seeking validation, not internal shift

# ----------------------------------------------------------------------------
# 9. CONTEXT & TONE MARKERS
# ----------------------------------------------------------------------------

conversational_tone_markers:
  category: "interaction_style"
  description: "Overall affect of user's communication"
  
  playful:
    patterns:
      - "lol"
      - "haha"
      - "😂"
      - "😄"
      - "😊"
      - "that's funny"
      - "I'm laughing"
      - "you're funny"
    weight: 0.6
    
  formal:
    patterns:
      - "I would like to"
      - "I appreciate"
      - "thank you for"
      - "I understand that"
      - "could you please"
    weight: 0.5
    
  casual:
    patterns:
      - "yeah"
      - "nah"
      - "kinda"
      - "sorta"
      - "tbh"
      - "idk"
      - "lmao"
    weight: 0.4
    
  distressed:
    patterns:
      - "!!!"
      - "..."
      - "I can't"
      - "help"
      - "please"
      - "urgent"
      - "NOW"
    weight: 0.8

conversation_flow_markers:
  category: "dialogue_dynamics"
  description: "Patterns affecting conversation pacing and depth"
  
  topic_change:
    patterns:
      - "anyway"
      - "speaking of"
      - "on another note"
      - "by the way"
      - "also"
      - "oh and"
    weight: 0.5
    
  deepening:
    patterns:
      - "actually"
      - "the thing is"
      - "to be honest"
      - "really"
      - "the truth is"
      - "what I mean is"
    weight: 0.7
    
  closing:
    patterns:
