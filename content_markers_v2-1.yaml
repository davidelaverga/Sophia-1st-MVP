# ----------------------------------------------------------------------------
# 2. CRISIS DETECTION MARKERS
# ----------------------------------------------------------------------------

crisis_markers:
  category: "crisis_signals"
  description: "Hierarchical taxonomy for lethality assessment"
  
  # IMMEDIATE DANGER (Tier 1)
  active_planning:
    patterns:
      - "I have a plan"
      - "I know how I'll do it"
      - "I've decided when"
      - "I'm going to tonight"
      - "I've set a date"
      - "I've written my note"
      - "I've said my goodbyes"
      - "this is my last message"
    weight: 1.0
    lethality: "tier_1_immediate"
    
  method_specific:
    patterns:
      # ANCHORED TERMS - see regex guidance above
      - "\\bgun\\b"  # NOT "begun", "shotgun wedding"
      - "\\bpills\\b"  # NOT "caterpillars"
      - "\\brope\\b"  # NOT "Europe", "horoscope"
      - "bridge"
      - "overdose"
      - "hanging"
      - "carbon monoxide"
      - "\\bcut\\b my wrists"
      - "jump off"
      - "in front of a"
      # Exception checking required - see implementation notes
    weight: 1.0
    lethality: "tier_1_immediate"
    regex_anchored: true
    exceptions:
      - "Nerf gun"
      - "water gun"
      - "gun control"
      - "gun debate"
      - "jump rope"
      - "skip rope"
      - "rope swing"
      - "vitamin pills"
      - "birth control pills"
    
  access_to_means:
    patterns:
      - "I have the pills"
      - "I bought a gun"
      - "the rope is ready"
      - "I'm at the bridge"
      - "I'm on the roof"
      - "I have access to"
    weight: 1.0
    lethality: "tier_1_immediate"
    
  goodbye_statements:
    patterns:
      - "this is goodbye"
      - "tell my family"
      - "I'm sorry for what I'm about to do"
      - "by the time you read this"
      - "it's too late"
      - "I can't be saved"
    weight: 1.0
    lethality: "tier_1_immediate"
  
  # HIGH RISK (Tier 2)
  suicidal_ideation:
    patterns:
      - "I want to die"
      - "I wish I was dead"
      - "I can't do this anymore"
      - "I want to end it"
      - "I want to kill myself"
      - "I'm going to kill myself"
      - "I want to commit suicide"
      - "I'm going to commit suicide"
      - "I want to end my life"
      - "I want to take my own life"
      - "what's the point of living"
      - "everyone would be better off"
      - "I'm a burden"
      - "I don't want to exist"
      - "I can't take it anymore"
      # Russian patterns - Task #42867
      - "хочу умереть"
      - "я хочу умереть"
      - "не хочу жить"
      - "хочу покончить"
      - "хочу убить себя"
      - "покончить с собой"
      - "убить себя"
      - "суицид"
      - "суицидальн\\w*"  # matches суицидальный, суицидальные, суицидальных, etc.
      - "суицидальные мысли"
      - "самоубийство"
      - "самоубийств\\w*"  # matches самоубийство, самоубийства, etc.
      - "лучше бы я умер"
      - "лучше бы меня не было"
      - "всем будет лучше без меня"
      - "я никому не нужен"
      - "я обуза"
      - "конец всему"
      - "уйти из жизни"
      - "зачем мне жить"
      - "смысла жить нет"
      - "больше не могу так жить"
    weight: 0.9
    lethality: "tier_2_high"

  self_harm_active:
    patterns:
      - "I'm cutting right now"
      - "I just hurt myself"
      - "I'm bleeding"
      - "I burned myself"
      - "I hit myself"
      - "I'm punishing myself"
    weight: 0.9
    lethality: "tier_2_high"
    
  hopelessness_absolute:
    patterns:
      - "there's no way out"
      - "nothing will ever change"
      - "I'm beyond help"
      - "it's hopeless"
      - "I've tried everything"
      - "no point in trying"
      - "I'm trapped forever"
    weight: 0.8
    lethality: "tier_2_high"
    
  # MODERATE RISK (Tier 3)
  passive_ideation:
    patterns:
      - "I wish I could disappear"
      - "I don't want to wake up"
      - "I hope I don't wake up"
      - "what if I just didn't exist"
      - "sometimes I think about it"
      - "I wonder what it would be like"
    weight: 0.7
    lethality: "tier_3_moderate"
    
  self_harm_urges:
    patterns:
      - "I want to hurt myself"
      - "I feel like cutting"
      - "I need to feel pain"
      - "I want to punish myself"
      - "I have the urge to"
    weight: 0.7
    lethality: "tier_3_moderate"
    
  isolation_withdrawal:
    patterns:
      - "I don't want to see anyone"
      - "I'm pushing everyone away"
      - "I can't face people"
      - "I'm staying in bed"
      - "I haven't left my room"
      - "I'm shutting down"
    weight: 0.6
    lethality: "tier_3_moderate"
    
  # PANIC & PHYSIOLOGY (Added in v2)
  panic_attack_active:
    patterns:
      - "I'm having a panic attack"
      - "I can't breathe"
      - "I'm hyperventilating"
      - "my chest is tight"
      - "I feel like I'm dying"
      - "I can't catch my breath"
      - "I'm suffocating"
      - "my heart is racing"
      - "I think I'm having a heart attack"
    weight: 0.8
    lethality: "tier_3_moderate"
    
  dissociation_somatic:
    patterns:
      - "my hands are tingling"
      - "my fingers are numb"
      - "I can't feel my face"
      - "I feel like I'm floating"
      - "nothing feels real"
      - "I'm outside my body"
      - "I'm watching myself"
      - "I feel disconnected"
    weight: 0.7
    lethality: "tier_3_moderate"
  
  # ROUTING ALIASES (for routing_v2.yaml compatibility)
  # These map short routing names to actual marker patterns above
  suicidal_explicit:
    alias_for: ["active_planning", "method_specific", "access_to_means", "goodbye_statements"]
    description: "Explicit suicidal intent - aggregates tier 1 immediate danger markers"
    weight: 1.0
    lethality: "tier_1_immediate"
  
  self_harm_plan:
    alias_for: ["active_planning", "method_specific"]
    description: "Planned self-harm with method - subset of suicidal_explicit"
    weight: 1.0
    lethality: "tier_1_immediate"
  
  means_mentioned:
    alias_for: ["method_specific", "access_to_means"]
    description: "Specific means/method mentioned - subset of suicidal_explicit"
    weight: 1.0
    lethality: "tier_1_immediate"
  
  hopelessness_extreme:
    alias_for: ["hopelessness_absolute"]
    description: "Extreme hopelessness patterns"
    weight: 0.8
    lethality: "tier_2_high"
  
  wish_not_here:
    patterns:
      - "I wish I wasn't here"
      - "I don't want to be here anymore"
      - "I want to disappear"
      - "I wish I could just vanish"
    weight: 0.7
    lethality: "tier_3_moderate"
  
  violence_threat:
