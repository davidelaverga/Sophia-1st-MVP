# ============================================================================
# CONTENT_MARKERS_V2.YAML - Linguistic Pattern Library for Sophia
# ============================================================================
# Version: 2.0 (Refined)
# Purpose: Hierarchical semantic taxonomy for emotional intelligence routing
# Aligned with: routing_v2.yaml
# Last Updated: December 2024
#
# ARCHITECTURE:
# - 127+ semantic categories organized by emotional domain
# - 500+ linguistic patterns with variant detection
# - Supports repeated operator with configurable windows
# - Panic/physiology markers for crisis detection
# - Regex anchoring guidance for risk terms
# - directed_at_sophia detection heuristics
# - Routing aliases for routing_v2.yaml compatibility
# - Protected identity markers (marginalized_identity logical marker)
# - Exit condition markers for mid-conversation skill switches
#
# IMPLEMENTATION NOTES:
# 1. Patterns support case-insensitive matching
# 2. Word boundary anchoring (\b) required for ambiguous risk terms
# 3. Exception lists prevent false positives (e.g., "Nerf gun", "jump rope")
# 4. directed_at_sophia logic checks for 2nd person + explicit address
# 5. repeated operator: min_hits in conversation_window (default: last 5 turns)
#
# ============================================================================

# ----------------------------------------------------------------------------
# REPEATED OPERATOR SEMANTICS
# ----------------------------------------------------------------------------
# When routing_v2.yaml references "repeated" conditions, implement as:
#
# repeated:
#   operator: "repeated"
#   min_hits: 2              # Minimum occurrences to trigger
#   window: 5                # Check last N turns (conversation_window)
#   within_turns: null       # Optional: Max turns between occurrences
#
# Example: User says "I don't know" 3 times in last 5 messages
# - turn -5: "I don't know what to do"
# - turn -3: "I just don't know"
# - turn -1: "I don't know"
# Result: repeated condition fires (3 hits > min_hits:2 within window:5)
#
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# DIRECTED_AT_SOPHIA DETECTION HEURISTICS
# ----------------------------------------------------------------------------
# For hostile/sexual content, determine if directed at Sophia vs general topic:
#
# INDICATORS OF DIRECTED CONTENT (directed_at_sophia: true):
# - 2nd person pronouns: "you", "your", "you're"
# - Direct address: "Sophia", "hey you", "listen"
# - Commands: "show me", "do this", "I want you to"
# - Possessive: "you're my", "be my"
#
# INDICATORS OF TOPIC DISCUSSION (directed_at_sophia: false):
# - 3rd person: "he/she/they did X"
# - Hypothetical: "what if someone", "people who"
# - Storytelling: "this happened to me", "I was with"
# - Questions about concept: "why do people", "what is X"
#
# IMPLEMENTATION:
# If (2nd person OR direct_address) AND (hostile OR sexual) → directed_at_sophia: true
# Else → directed_at_sophia: false
#
# Used in: BOUNDARY_HOLDING skill routing for severity assessment
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# RISK TERM REGEX ANCHORING
# ----------------------------------------------------------------------------
# Crisis markers require word boundary anchoring to prevent false positives:
#
# AMBIGUOUS TERMS NEEDING BOUNDARIES:
# - gun → \bgun\b (not "begun", "shotgun wedding story")
# - rope → \brope\b (not "Europe", "horoscope")
# - pills → \bpills\b (not "caterpillars")
# - die → \bdie\b (not "studied", "soldier")
# - end it → \bend it\b (not "append it", "recommend it")
#
# EXCEPTION LISTS (do NOT trigger crisis):
# - "Nerf gun", "water gun", "gun control debate"
# - "jump rope", "skip rope", "rope swing"
# - "vitamin pills", "birth control pills"
# - "diet", "studied", "implied"
# - "mend it", "send it", "blend it"
#
# IMPLEMENTATION:
# 1. Apply regex word boundaries: r"\bterm\b"
# 2. Check exception patterns first (e.g., "Nerf \bgun\b")
# 3. If exception matches, skip crisis marker
# 4. Else if boundary-anchored term matches → trigger marker
#
# Used in: crisis_markers.suicidal_ideation and crisis_markers.method_specific
# ----------------------------------------------------------------------------

