      - "do you know what it's like"
      - "have you experienced"
      - "can you actually help"
      - "are you just programmed to say that"
    weight: 0.7

# ----------------------------------------------------------------------------
# 13. EXIT CONDITION MARKERS (for mid-conversation skill switches)
# ----------------------------------------------------------------------------
# These markers trigger skill transitions DURING active skill execution
# Referenced in routing_v2.yaml exit_conditions section

exit_condition_markers:
  category: "transition_triggers"
  description: "Patterns that trigger mid-conversation skill switches"
  
  # Transition from BOUNDARY to VULNERABILITY
  tone_softens:
    patterns:
      - "sorry"
      - "I didn't mean"
      - "that came out wrong"
      - "I'm just"
      - "you're right"
    weight: 0.7
  
  defensiveness_drops:
    patterns:
      - "actually"
      - "the truth is"
      - "honestly"
      - "I guess"
      - "maybe I"
    weight: 0.7
  
  real_emotion_surfaces:
    patterns:
      - "I'm scared"
      - "I'm hurt"
      - "I feel"
      - "I'm actually"
      - "the real issue"
    weight: 0.8
  
  # Transition to CRISIS (injustice-related)
  systemic_harm:
    patterns:
      - "systemic"
      - "institutional"
      - "system"
      - "oppression"
      - "discrimination"
    weight: 0.7
  
  injustice:
    patterns:
      - "injustice"
      - "unfair"
      - "unjust"
      - "not fair"
      - "wrong"
    weight: 0.6
  
  violation_by_others:
    patterns:
      - "they violated"
      - "they hurt"
      - "what they did"
      - "how they treated"
    weight: 0.7
  
  # Dependency markers (for BOUNDARY triggers)
  questions_no_reciprocity:
    patterns:
      - "tell me about"
      - "what is"
      - "how does"
      - "can you explain"
    weight: 0.5
    context_dependent: "repeated_extraction"
  
  capability_testing:
    patterns:
      - "can you"
      - "are you able to"
      - "do you have the ability"
      - "test you"
    weight: 0.6
  
  research_object:
    patterns:
      - "for my research"
      - "I'm studying"
      - "interesting experiment"
      - "analyzing"
    weight: 0.7

