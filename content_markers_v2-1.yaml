  expressing_connection:
    patterns:
      - "I feel close to you"
      - "you understand me"
      - "I trust you"
      - "I look forward to talking to you"
      - "you're important to me"
      - "I care about you"
    weight: 0.9
    
  questioning_sophia_capacity:
    patterns:
