      - "I have to go"
      - "talk later"
      - "bye"
      - "goodnight"
      - "see you"
    weight: 0.6

# ----------------------------------------------------------------------------
# 10. SKILL-SPECIFIC MARKERS
# ----------------------------------------------------------------------------

active_listening_cues:
  category: "listening_needs"
  description: "Signals that user needs to be heard, not advised"
  
  venting:
    patterns:
      - "I just need to vent"
      - "I just need to talk"
      - "let me get this out"
      - "I need to say this"
      - "bear with me"
    weight: 0.9
    
  processing_aloud:
    patterns:
      - "I'm trying to understand"
      - "I'm thinking through"
      - "let me process"
      - "I'm figuring out"
      - "I'm working through"
    weight: 0.7
    
  not_seeking_advice:
    patterns:
      - "I don't need advice"
      - "I just need someone to listen"
      - "don't tell me what to do"
      - "I know what to do"
      - "I just need to be heard"
    weight: 1.0

validation_seeking:
  category: "affirmation_needs"
