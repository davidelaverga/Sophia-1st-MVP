version: '3.8'

services:
  # FastAPI Backend with Audio Queue Manager
  sophia-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sophia-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Redis connection (override)
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Server config
      - PORT=8000
      - PYTHONUNBUFFERED=1

    volumes:
      # Mount code for hot reload during development
      - ./app:/app/app
      - ./main.py:/app/main.py

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - sophia-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis for memory caching
  redis:
    image: redis:7-alpine
    container_name: sophia-redis
    ports:
      - "6379:6379"

    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    volumes:
      - redis-data:/data

    networks:
      - sophia-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
    driver: local

networks:
  sophia-network:
    driver: bridge
